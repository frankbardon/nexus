name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.25"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: make build

      - name: Test
        run: make test

      # Separate step so a broker-integration failure is attributable at a
      # glance instead of being buried in the unit-test output above. Reuses the
      # Go toolchain from the "Set up Go" step; no extra setup needed.
      #
      # Scoped to ./cmd/nexus-broker/ deliberately: tests/integration/ carries
      # the same //go:build integration tag but makes real LLM calls in live
      # mode and would fail here without ANTHROPIC_API_KEY. The broker suite is
      # loopback-only — it compiles and spawns its own stub instance binaries —
      # so it needs no API key and no repo secrets.
      - name: Broker integration tests
        run: make test-broker-integration

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Vet
        run: make vet

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Lint
        run: make lint
