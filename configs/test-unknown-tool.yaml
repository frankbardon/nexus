# Test: a model-called tool that no plugin handles must not hang the turn.
#
# ReAct + the tool catalog with NO tool plugins. The first mock response calls
# get_weather, which nothing registers or serves; nexus.tool.catalog answers the
# orphaned tool.invoke with an error tool.result ("unknown tool: get_weather"),
# the model sees it on the next request, and the second mock response closes
# the turn. Mock mode only — no API key needed.
#
# Run:
#   go test -tags integration ./tests/integration/ -run TestUnknownTool

core:
  log_level: warn
  tick_interval: 5s
  max_concurrent_events: 100
  models:
    default: quick
    quick:
      provider: nexus.llm.anthropic
      model: claude-haiku-4-5-20251001
      max_tokens: 4096
  sessions:
    # Manual runs only (bin/nexus -config ...). pkg/testharness replaces
    # this, and core.storage.root, with a per-test temp dir.
    root: ~/.nexus/test-sessions
    retention: 30d
    id_format: datetime_short

plugins:
  active:
    - nexus.io.test
    - nexus.llm.anthropic
    - nexus.agent.react
    - nexus.tool.catalog
    - nexus.memory.capped

  nexus.io.test:
    inputs:
      - "What is the weather in Paris?"
    approval_mode: approve
    timeout: 20s
    mock_responses:
      - tool_calls:
          - name: get_weather
            arguments: '{"city":"Paris"}'
      - content: "I could not look up the weather."

  nexus.llm.anthropic:
    api_key: "sk-mock-not-used"

  nexus.agent.react:
    system_prompt: "You are a test agent. Use tools when asked."

  nexus.memory.capped:
    max_messages: 10
    persist: false
